[package]
name = "personal_schedule_management"
version = "0.1.0"
description = "Personal productivity and life management desktop application"
authors = ["Saim Raza"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "personal_schedule_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
